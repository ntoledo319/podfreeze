name: 'CocoaPods Trunk Freeze Check'
description: 'Fails your CI if any pod resolves from CocoaPods trunk and cannot receive patches after 2 Dec 2026'
author: 'Toledo Technologies'
branding:
  icon: 'alert-triangle'
  color: 'orange'

inputs:
  path:
    description: 'Path to Podfile.lock (or a directory containing one)'
    required: false
    default: 'Podfile.lock'
  fail-on-exposed:
    description: 'Exit non-zero if any pod resolves from trunk'
    required: false
    default: 'false'
  fail-on-undetermined:
    description: >
      Exit non-zero if any pod source could NOT be determined (a lockfile written by
      CocoaPods < 1.7 has no SPEC REPOS section). Without this, such a project passes
      fail-on-exposed with 0 exposed pods and looks identical to a clean one.
    required: false
    default: 'false'
  comment-on-pr:
    description: 'Post the report as a PR comment (needs pull-requests: write)'
    required: false
    default: 'false'
  license:
    description: 'podfreeze Pro licence key (enables the --pro migration plan)'
    required: false
    default: ''

outputs:
  exposed-count:
    description: 'Number of pods resolving from CocoaPods trunk'
    value: ${{ steps.scan.outputs.exposed-count }}
  examined-count:
    description: 'Number of pods examined'
    value: ${{ steps.scan.outputs.examined-count }}
  undetermined-count:
    description: 'Number of pods whose source could not be determined (no SPEC REPOS section)'
    value: ${{ steps.scan.outputs.undetermined-count }}
  report-path:
    description: 'Path to the JSON report'
    value: ${{ steps.scan.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install podfreeze
      shell: bash
      # Install the version the consumer actually pinned. Fetching @main here would
      # silently ignore `uses: ntoledo319/podfreeze@v0.8.0` and run whatever is on
      # main instead -- a pin that does not pin is worse than no pin.
      run: pip install --quiet "$GITHUB_ACTION_PATH"

    - name: Scan
      id: scan
      shell: bash
      env:
        PODFREEZE_LICENSE: ${{ inputs.license }}
      run: |
        set -o pipefail
        podfreeze --json "${{ inputs.path }}" > podfreeze-report.json

        EXPOSED=$(python3 -c "import json;print(json.load(open('podfreeze-report.json'))['counts'].get('trunk',0))")
        EXAMINED=$(python3 -c "import json;print(json.load(open('podfreeze-report.json'))['examined'])")
        # A lockfile written by CocoaPods < 1.7 has no SPEC REPOS section, so sources
        # cannot be determined. Those pods are reported as 'unknown', NOT as exposed,
        # so a project that cannot be assessed passes fail-on-exposed and looks clean.
        UNKNOWN=$(python3 -c "import json;print(json.load(open('podfreeze-report.json'))['counts'].get('unknown',0))")
        echo "undetermined-count=$UNKNOWN" >> "$GITHUB_OUTPUT"
        echo "exposed-count=$EXPOSED" >> "$GITHUB_OUTPUT"
        echo "examined-count=$EXAMINED" >> "$GITHUB_OUTPUT"
        echo "report-path=podfreeze-report.json" >> "$GITHUB_OUTPUT"

        {
          echo "## CocoaPods trunk freeze check"
          echo ""
          if [ -n "${PODFREEZE_LICENSE}" ]; then
            podfreeze --pro "${{ inputs.path }}"
          else
            podfreeze "${{ inputs.path }}"
          fi
        } > podfreeze-summary.txt

        cat podfreeze-summary.txt
        {
          echo '```'
          cat podfreeze-summary.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "${{ inputs.fail-on-undetermined }}" = "true" ] && [ "$UNKNOWN" -gt 0 ]; then
          echo "::error::$UNKNOWN pod(s) have an undeterminable source - this lockfile predates SPEC REPOS, so a clean result cannot be proven. Re-run 'pod install' with a modern CocoaPods."
          exit 1
        fi
        if [ "${{ inputs.fail-on-exposed }}" = "true" ] && [ "$EXPOSED" -gt 0 ]; then
          echo "::error::$EXPOSED pod(s) resolve from CocoaPods trunk and cannot receive published updates after 2026-12-02"
          exit 1
        fi

    - name: Comment on PR
      if: ${{ inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        {
          echo '```'
          cat podfreeze-summary.txt
          echo '```'
        } > pf-comment.md
        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "${{ github.repository }}" --body-file pf-comment.md || \
          echo "::warning::could not post PR comment (needs pull-requests: write permission)"
