[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podfreeze"
version = "0.7.4"
description = "Find which CocoaPods dependencies can never receive another security patch after the 2 Dec 2026 trunk freeze"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["cocoapods", "ios", "swift", "dependencies", "supply-chain", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security",
]
dependencies = ["PyYAML>=5.1"]

[project.scripts]
podfreeze = "podfreeze.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["podfreeze"]

[tool.pytest.ini_options]
markers = [
    "network: hits the live site; skipped automatically when unreachable",
]
