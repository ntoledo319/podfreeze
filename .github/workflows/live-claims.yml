name: live-claims

# Runs without anyone remembering. Every claim on the live site is checked weekly, so a
# page edit that quietly makes a promise false gets reported instead of sitting there.
on:
  schedule:
    - cron: "17 9 * * 1"     # Mondays 09:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/test_live_claims.py"

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Check every published claim against the live site
        id: claims
        run: python -m pytest tests/test_live_claims.py -q -m network --strict-markers

      # A scheduled check nobody reads is not a check. If a live claim has become false,
      # open an issue -- the same support route buyers are pointed at.
      #
      # Fires on schedule AND dispatch: restricting it to schedule made the alert path
      # untestable, so the only way to learn whether it worked would have been a real
      # failure at an unattended moment.
      - name: Report a broken claim
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Live site claim check failed";
            const body = [
              "The scheduled `live-claims` run failed, which means a statement on the",
              "published site no longer matches what the product does or what the data",
              "says.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "These checks cover: the freeze date, the 'your build does not break'",
              "claim, the browser checker's 'nothing is uploaded' promise, the findings",
              "sampling caveat, whether the published percentage still matches its own",
              "numbers, and whether the install command is pinned.",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "automated",
            });
            if (!existing.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["automated"],
              });
            }
