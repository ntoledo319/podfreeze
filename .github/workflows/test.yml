name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # node is REQUIRED, not optional: the parity tests execute the browser checker's
      # real parser and compare it against the CLI. Without node they skip, and a skip
      # reported as green is how the two implementations silently drifted once already.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -e ".[dev]"
      # -p no:randomly keeps ordering stable; --strict-markers catches typo'd marks.
      # The grep gate fails the build if ANY test skipped: every guard must actually run.
      - name: Run tests, failing on any skip
        run: |
          set -o pipefail   # without this, tee masks a pytest failure
          # Deselect the network tests here. They legitimately SKIP when the live site is
          # unreachable -- an outage is not a false claim -- which collides with the
          # no-skip gate below. Both rules are right; they cannot share a job. The live
          # claims are checked by live-claims.yml, which is allowed to skip.
          python -m pytest tests -q -rs --strict-markers -m "not network" | tee /tmp/pytest.out
          if grep -qE '[0-9]+ skipped' /tmp/pytest.out; then
            echo "::error::a test SKIPPED in CI — a disarmed guard reports green"
            exit 1
          fi

  action-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a fixture Podfile.lock
        run: |
          cat > Podfile.lock <<'EOF'
          PODS:
            - Alamofire (5.8.1)
            - InternalAuth (2.1.0)

          DEPENDENCIES:
            - Alamofire
            - InternalAuth

          SPEC REPOS:
            trunk:
              - Alamofire
            https://github.internal.example/Specs.git:
              - InternalAuth

          COCOAPODS: 1.15.2
          EOF

      - name: Run the action against the fixture
        id: scan
        uses: ./
        with:
          path: Podfile.lock

      - name: Assert the action reported the expected counts
        run: |
          echo "exposed=${{ steps.scan.outputs.exposed-count }} examined=${{ steps.scan.outputs.examined-count }}"
          test "${{ steps.scan.outputs.exposed-count }}" = "1"
          test "${{ steps.scan.outputs.examined-count }}" = "2"
          echo "action self-test passed"
