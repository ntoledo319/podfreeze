name: Licence key or refund
description: Your key does not work, or you want your money back.
title: "[licence] "
labels: ["licence"]
body:
  - type: markdown
    attributes:
      value: |
        **Refunds are given on request, with no argument and no time limit.** You do not
        need to justify it and you do not need to fill this in completely — "refund
        please" is enough.

        If your key is not working, the details below usually make it solvable in one
        reply rather than three.

        **This issue will be public.** Anything you type here is visible to anyone
        and stays visible. The checkout email below is optional — leave it blank if
        you would rather not publish it.

  - type: input
    id: email
    attributes:
      label: Email used at checkout (optional — this issue is public)
      description: >-
        Only needed to find the payment, and this issue is PUBLIC. Leave it blank if
        you would rather not publish it.
      placeholder: leave blank if you would rather not publish it
    validations:
      required: false

  - type: dropdown
    id: want
    attributes:
      label: What would you like?
      options:
        - A refund
        - Help getting the key working
        - Not sure yet
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: |
        If the key is rejected, paste the exact command and the output. Do **not** paste
        the key itself — the first eight characters are enough to identify it.
      placeholder: |
        $ podfreeze --pro Podfile.lock
        podfreeze: licence key not recognised

        Key starts: PDFZ2-OB...
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `podfreeze --version`
      placeholder: podfreeze 0.5.2
